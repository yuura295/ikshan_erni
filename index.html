<div class="cover-screen">
        <h1>Selamat Datang di Undangan Kami</h1>
        <p>Kepada Yth. Bapak/Ibu/Saudara/i:</p>
        
        <!-- TEMPAT NAMA TAMU DI HALAMAN PERTAMA -->
        <h2 id="nama-tamu" style="color: #bd9a5f;">Nama Tamu</h2>
        
        <!-- Tombol langsung memicu fungsi pindahHalaman() -->
        <button class="btn-buka" onclick="pindahHalaman()">Buka Undangan</button>
    </div>

    <script>
        // 1. Fungsi Menangkap Nama dari URL (?to=Nama+Tamu)
        function tampilkanNamaTamu() {
            const urlParams = new URLSearchParams(window.location.search);
            let nama = urlParams.get('to');
            
            if (nama) {
                nama = decodeURIComponent(nama);
                document.getElementById("nama-tamu").innerText = nama;
            } else {
                document.getElementById("nama-tamu").innerText = "Tamu Undangan";
            }
        }

        // 2. Fungsi Pindah ke Halaman Kedua (Langsung tanpa mengoper nama lagi)
        function pindahHalaman() {
            window.location.href = "undangan.html";
        }

        // Jalankan pencarian nama saat halaman selesai dimuat
        window.addEventListener("DOMContentLoaded", tampilkanNamaTamu);
    </script>


  </body>
